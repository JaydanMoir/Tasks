<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover обязателен: без него env(safe-area-inset-*) всегда 0,
     и на iPhone шапка уезжает под Dynamic Island -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Tasks</title>
<link rel="stylesheet" href="css/style.css?v=15">
</head>
<body>
<div id="app">

  <!-- Затемнение под выдвижным меню (только на узких экранах) -->
  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <button class="quick-add-btn" id="btnQuickAdd" title="Новая задача (N)">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 1v14M1 8h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        Новая задача
      </button>
    </div>

    <div class="notif-banner" id="notifBanner" hidden>
      <button class="notif-banner-close" id="btnDismissNotif" title="Скрыть">✕</button>
      <span id="notifBannerText">🔔 Включить уведомления о напоминаниях?</span>
      <button id="btnEnableNotif">Включить</button>
    </div>

    <div class="search-box" id="searchBox" title="Поиск по задачам и заметкам">
      <svg viewBox="0 0 16 16" width="13" height="13"><path d="M11 11l4 4M7 12A5 5 0 107 2a5 5 0 000 10z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
      <input type="text" id="searchInput" placeholder="Поиск">
      <span class="search-kbd" title="Быстрый переход (Ctrl/⌘ + K)" role="button" tabindex="0">⌘K</span>
    </div>

    <nav class="nav-lists" id="navLists">
      <!-- built-in lists injected by JS -->
    </nav>

    <div class="sidebar-divider"></div>

    <div class="areas-tree" id="areasTree">
      <!-- areas/projects injected by JS -->
    </div>

    <div class="sidebar-bottom">
      <button class="sidebar-add-btn" id="btnAddArea">+ Область</button>
      <button class="sidebar-add-btn" id="btnAddProject">+ Проект</button>
    </div>
    <div class="sidebar-bottom sidebar-bottom-secondary">
      <button class="sidebar-add-btn" id="btnExport" title="Скачать резервную копию всех данных">⬇ Экспорт</button>
      <button class="sidebar-add-btn" id="btnImport" title="Загрузить данные из файла резервной копии">⬆ Импорт</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>

    <div class="theme-row">
      <span class="theme-row-label">Оформление</span>
      <div class="theme-switch" role="group" aria-label="Оформление">
        <!-- Бегунок отдельным элементом: подсветка активного через фон не умеет
             ездить, а именно движение и читается как переключатель. -->
        <span class="theme-thumb" aria-hidden="true"></span>
        <button type="button" class="theme-opt" data-theme-set="system" title="Как в системе" aria-label="Как в системе">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 1.8a6.2 6.2 0 000 12.4z" fill="currentColor"/>
          </svg>
        </button>
        <button type="button" class="theme-opt" data-theme-set="light" title="Светлая" aria-label="Светлая тема">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <circle cx="8" cy="8" r="3.2" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1"/>
            </g>
          </svg>
        </button>
        <button type="button" class="theme-opt" data-theme-set="dark" title="Тёмная" aria-label="Тёмная тема">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path d="M13.4 10.3A5.8 5.8 0 015.7 2.6a5.9 5.9 0 107.7 7.7z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main list -->
  <main class="main-panel">
    <header class="main-header">
      <div class="main-header-title">
        <button class="menu-btn" id="btnMenu" title="Списки и проекты" aria-label="Открыть меню">
          <svg viewBox="0 0 18 18" width="17" height="17"><path d="M2 4.5h14M2 9h14M2 13.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <span class="main-icon" id="mainIcon"></span>
        <h1 id="mainTitle">Сегодня</h1>
        <!-- Поиск жил только в боковом меню: чтобы что-то найти, приходилось
             выдвигать панель. Здесь он в одно касание. -->
        <button class="header-search-btn" id="btnHeaderSearch" title="Поиск (⌘K)" aria-label="Поиск">
          <svg viewBox="0 0 18 18" width="17" height="17" aria-hidden="true">
            <path d="M12.5 12.5l4 4M8 14A6 6 0 108 2a6 6 0 000 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="main-header-sub" id="mainSubtitle"></div>
    </header>

    <div class="task-list" id="taskList">
      <!-- task groups injected by JS -->
    </div>

    <button class="fab" id="btnFab" title="Новая задача">
      <svg viewBox="0 0 20 20" width="20" height="20"><path d="M10 2v16M2 10h16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </main>

  <!-- Detail panel -->
  <aside class="detail-panel" id="detailPanel">
    <div class="detail-empty" id="detailEmpty">
      <p>Выберите задачу</p>
    </div>
  </aside>

</div>

<!-- Quick Add Modal -->
<div class="modal-overlay" id="quickAddOverlay">
  <div class="modal quick-add-modal">
    <div class="quick-add-title-row">
      <input type="text" id="quickAddTitle" placeholder="Что нужно сделать?" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
      <button type="button" class="mic-btn" id="btnQuickAddMic" hidden title="Продиктовать задачу" aria-label="Продиктовать задачу">
        <svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true">
          <path d="M10 2.5a2.5 2.5 0 012.5 2.5v5a2.5 2.5 0 01-5 0V5A2.5 2.5 0 0110 2.5z" fill="currentColor"/>
          <path d="M5 9.5a5 5 0 0010 0M10 14.5V17.5M7 17.5h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- статус диктовки: слышимая подсказка нужна и на телефоне, где обычная скрыта -->
    <div class="voice-status" id="quickAddVoiceStatus" hidden aria-live="polite"></div>

    <!-- что распозналось из текста; заполняется на лету -->
    <div class="parse-chips" id="quickAddChips" hidden></div>

    <div class="quick-chips" id="quickAddQuickChips">
      <button type="button" class="quick-chip" data-when="today">Сегодня</button>
      <button type="button" class="quick-chip" data-when="tomorrow">Завтра</button>
      <button type="button" class="quick-chip" data-when="weekend">Выходные</button>
      <button type="button" class="quick-chip" data-when="pick">Дата…</button>
    </div>

    <input type="text" id="quickAddNotes" placeholder="Заметки" autocomplete="off">
    <div class="quick-add-row">
      <!-- Поле даты стоит в сетке, а не отдельной строкой сверху: выбранная дата
           добавляла окну третий этаж. Когда она задана, список «когда» прячется —
           он всё равно показывал бы только «Дата…», что кнопка говорит лучше. -->
      <button type="button" id="quickAddWhenDate" class="date-field empty" data-value="" hidden>📅 Выбрать дату</button>
      <select id="quickAddWhen">
        <option value="">Не запланировано</option>
        <option value="today">Сегодня</option>
        <option value="evening">Этим вечером</option>
        <option value="date">Дата…</option>
        <option value="someday">Когда-нибудь</option>
      </select>
      <select id="quickAddProject">
        <option value="">Входящие</option>
      </select>
      <!-- Стоит здесь, а не отдельной строкой выше: там оно появлялось прямо
           во время набора и толкало вниз заметки и кнопку «Добавить». -->
      <select id="quickAddLead" class="quick-add-lead" hidden></select>
      <button id="quickAddSubmit">Добавить</button>
    </div>
    <div class="quick-add-hint">Можно писать сразу: «позвонить маме завтра в 18:00 !2 #дом»</div>
  </div>
</div>

<!-- Command Palette -->
<div class="modal-overlay" id="paletteOverlay">
  <div class="modal palette-modal">
    <input type="text" id="paletteInput" placeholder="Перейти к списку, проекту, тегу, задаче…" autocomplete="off">
    <div class="palette-results" id="paletteResults"></div>
  </div>
</div>

<!-- Task context menu -->
<div class="context-menu" id="taskContextMenu" hidden></div>

<!-- Toast / undo -->
<div class="toast" id="toast" hidden>
  <span id="toastMsg"></span>
  <button id="toastUndo">Отменить</button>
</div>

<!-- Рантайм Capacitor. В браузере просто сообщает getPlatform()==="web",
     в приложении даёт мост к нативным плагинам. Обязан идти до модуля. -->
<script src="capacitor.js"></script>
<script type="module" src="js/app.js?v=15"></script>
</body>
</html>
